<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cake Cutter AR - Standalone Web App</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            neon: { cyan: '#00f3ff', pink: '#ff007f', green: '#39ff14', yellow: '#ffe600', purple: '#b026ff' }
          },
          boxShadow: {
            'neon-cyan': '0 0 15px rgba(0, 243, 255, 0.6), 0 0 30px rgba(0, 243, 255, 0.3)',
            'neon-pink': '0 0 15px rgba(255, 0, 127, 0.6), 0 0 30px rgba(255, 0, 127, 0.3)',
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for Browser JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- TensorFlow.js & COCO-SSD CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3 { font-family: 'Outfit', sans-serif; }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const NEON_THEMES = {
      cyan: { stroke: '#00f3ff', glow: 'rgba(0, 243, 255, 0.8)', fill: 'rgba(0, 243, 255, 0.12)' },
      pink: { stroke: '#ff007f', glow: 'rgba(255, 0, 127, 0.8)', fill: 'rgba(255, 0, 127, 0.12)' },
      green: { stroke: '#39ff14', glow: 'rgba(57, 255, 20, 0.8)', fill: 'rgba(57, 255, 20, 0.12)' },
      yellow: { stroke: '#ffe600', glow: 'rgba(255, 230, 0, 0.8)', fill: 'rgba(255, 230, 0, 0.12)' }
    };

    function App() {
      const [sliceCount, setSliceCount] = useState(6);
      const [cutType, setCutType] = useState('radial');
      const [themeKey, setThemeKey] = useState('cyan');
      const [isCameraActive, setIsCameraActive] = useState(false);
      const [isCameraLoading, setIsCameraLoading] = useState(false);
      const [model, setModel] = useState(null);
      const [isModelLoading, setIsModelLoading] = useState(true);
      const [detectedObject, setDetectedObject] = useState(null);
      const [isLocked, setIsLocked] = useState(false);

      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamRef = useRef(null);
      const requestRef = useRef(null);

      // 1. Load TensorFlow COCO-SSD
      useEffect(() => {
        if (window.cocoSsd) {
          window.cocoSsd.load().then(m => {
            setModel(m);
            setIsModelLoading(false);
          }).catch(err => {
            console.error('TF load error:', err);
            setIsModelLoading(false);
          });
        }
      }, []);

      // 2. Camera Start / Stop
      const startCamera = async () => {
        setIsCameraLoading(true);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
          });
          streamRef.current = stream;
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            await videoRef.current.play();
          }
          setIsCameraActive(true);
        } catch (e) {
          alert('Camera Access Error: ' + e.message);
        } finally {
          setIsCameraLoading(false);
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
        }
        setIsCameraActive(false);
        setDetectedObject(null);
      };

      // 3. AI Prediction Loop
      useEffect(() => {
        if (!model || !isCameraActive || isLocked) return;

        let active = true;
        const detect = async () => {
          if (!active) return;
          const video = videoRef.current;
          if (video && video.readyState === 4) {
            try {
              const predictions = await model.detect(video, 5, 0.45);
              const food = predictions.find(p => ['cake', 'pizza', 'donut', 'apple', 'bowl'].includes(p.class));
              if (food) {
                setDetectedObject(food);
              } else if (predictions.length > 0) {
                setDetectedObject(predictions[0]);
              }
            } catch (e) {}
          }
          if (active) requestRef.current = requestAnimationFrame(detect);
        };
        detect();

        return () => {
          active = false;
          if (requestRef.current) cancelAnimationFrame(requestRef.current);
        };
      }, [model, isCameraActive, isLocked]);

      // 4. Render AR Overlay
      useEffect(() => {
        const canvas = canvasRef.current;
        const video = videoRef.current;
        if (!canvas || !video || !isCameraActive) return;

        const ctx = canvas.getContext('2d');
        const rect = video.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;

        ctx.clearRect(0, 0, rect.width, rect.height);

        const theme = NEON_THEMES[themeKey];
        const scaleX = rect.width / (video.videoWidth || rect.width);
        const scaleY = rect.height / (video.videoHeight || rect.height);

        let bbox = detectedObject ? [
          detectedObject.bbox[0] * scaleX,
          detectedObject.bbox[1] * scaleY,
          detectedObject.bbox[2] * scaleX,
          detectedObject.bbox[3] * scaleY
        ] : [rect.width * 0.25, rect.height * 0.2, rect.width * 0.5, rect.height * 0.6];

        const [x, y, w, h] = bbox;
        const cx = x + w / 2;
        const cy = y + h / 2;
        const rx = w / 2;
        const ry = h / 2;

        ctx.save();
        ctx.strokeStyle = theme.stroke;
        ctx.shadowColor = theme.glow;
        ctx.shadowBlur = 15;
        ctx.lineWidth = 3;
        ctx.fillStyle = theme.fill;

        // Draw outer ellipse / box
        if (cutType === 'radial') {
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx, ry, 0, 0, 2 * Math.PI);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.rect(x, y, w, h);
          ctx.fill();
          ctx.stroke();
        }

        // Draw Radial Slice Lines
        if (cutType === 'radial' && sliceCount > 1) {
          ctx.setLineDash([8, 6]);
          const step = (2 * Math.PI) / sliceCount;
          for (let i = 0; i < sliceCount; i++) {
            const angle = i * step - Math.PI / 2;
            const px = cx + rx * Math.cos(angle);
            const py = cy + ry * Math.sin(angle);
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(px, py);
            ctx.stroke();
          }
        } else if (cutType === 'parallel' && sliceCount > 1) {
          ctx.setLineDash([8, 6]);
          const step = w / sliceCount;
          for (let i = 1; i < sliceCount; i++) {
            ctx.beginPath();
            ctx.moveTo(x + i * step, y);
            ctx.lineTo(x + i * step, y + h);
            ctx.stroke();
          }
        }

        // Tag
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(x, y - 28, 160, 24);
        ctx.fillStyle = theme.stroke;
        ctx.font = 'bold 12px Inter';
        ctx.fillText(`${(detectedObject ? detectedObject.class : 'Target').toUpperCase()} • ${sliceCount} SLICES`, x + 8, y - 12);

        ctx.restore();
      }, [isCameraActive, detectedObject, sliceCount, cutType, themeKey]);

      return (
        <div className="max-w-4xl mx-auto p-4 space-y-4">
          <header className="flex items-center justify-between p-4 glass-panel rounded-2xl">
            <h1 className="text-xl font-bold text-cyan-400 flex items-center gap-2">
              <span>🎂</span> Cake Cutter AR
            </h1>
            <span className="text-xs px-3 py-1 rounded-full bg-slate-800 text-slate-300">
              {isModelLoading ? 'Loading AI Model...' : 'AI Ready'}
            </span>
          </header>

          <div className="relative aspect-video bg-slate-950 rounded-2xl overflow-hidden border border-slate-800 flex items-center justify-center">
            <video ref={videoRef} playsInline autoPlay muted className={`w-full h-full object-cover ${isCameraActive ? 'block' : 'hidden'}`} />
            <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none" />
            
            {!isCameraActive && (
              <div className="text-center p-6 space-y-4">
                <div className="text-6xl">🎂</div>
                <h2 className="text-2xl font-bold">Equal Slice AI Assistant</h2>
                <button onClick={startCamera} className="py-3 px-8 rounded-xl bg-cyan-500 text-slate-950 font-bold hover:brightness-110 shadow-neon-cyan">
                  {isCameraLoading ? 'Starting Camera...' : 'Start Camera'}
                </button>
              </div>
            )}
          </div>

          <div className="p-4 glass-panel rounded-2xl flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center gap-3">
              <span className="font-semibold text-sm">Pieces:</span>
              <button onClick={() => setSliceCount(Math.max(2, sliceCount - 1))} className="w-8 h-8 rounded-lg bg-slate-800 font-bold">-</button>
              <span className="font-bold text-lg font-mono px-2">{sliceCount}</span>
              <button onClick={() => setSliceCount(Math.min(32, sliceCount + 1))} className="w-8 h-8 rounded-lg bg-slate-800 font-bold">+</button>
            </div>

            <div className="flex gap-2">
              <button onClick={() => setCutType('radial')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${cutType === 'radial' ? 'bg-cyan-500 text-slate-950' : 'bg-slate-800'}`}>Radial</button>
              <button onClick={() => setCutType('parallel')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${cutType === 'parallel' ? 'bg-cyan-500 text-slate-950' : 'bg-slate-800'}`}>Strips</button>
            </div>

            {isCameraActive && (
              <button onClick={stopCamera} className="px-4 py-2 rounded-xl bg-rose-600 font-bold text-xs">Stop Camera</button>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
